# Pocket Cameras (Go + SQLite + ffmpeg) — your security cameras: live view, events looked at by AI, recordings, modes, alerts.
services:
  pocket-cameras:
    image: ghcr.io/abjelosevic88/pocket-homelab-cameras:latest
    container_name: pocket-cameras
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NOTIFY_URL: ${NOTIFY_URL:-}
      # RECORDINGS_DIR: /recordings     # and mount a big disk there
      # RECORDINGS_MAX_GB: "500"
      # Pocket Core: one sign-in, Pocket AI, and app links to Pocket Alerts, Network, Movement, Travel,
      # Parcels, Pets, Weather, Chat, Tasks, Notes, Photos, Files, Rooms and Home.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
      # - /mnt/nas/cameras:/recordings
    extra_hosts:
      - "host.docker.internal:host-gateway"
